name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo
          POSTGRES_DB: echo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echo" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: pytest (PostgreSQL)
        env:
          ECHO_TEST_USE_POSTGRES: "1"
          DATABASE_URL: postgres://echo:echo@localhost:5432/echo
        run: uv run pytest -q -p no:cacheprovider --no-reuse-db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npx vitest run
      - run: npm run build

  image:
    # Multi-arch build check (no push). Coolify builds the real image from the Dockerfile.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          target: prod
          platforms: linux/arm64,linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
